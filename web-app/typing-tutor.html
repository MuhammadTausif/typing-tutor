<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f172a">
    <meta name="description" content="A refined typing tutor for improving your typing speed and accuracy.">
    <title>Velocity - Typing Tutor</title>
    <link rel="manifest" href="data:application/json,{&quot;name&quot;:&quot;Velocity Typing Tutor&quot;,&quot;short_name&quot;:&quot;Velocity&quot;,&quot;description&quot;:&quot;Master your typing speed&quot;,&quot;start_url&quot;:&quot;./&quot;,&quot;display&quot;:&quot;standalone&quot;,&quot;background_color&quot;:&quot;#0f172a&quot;,&quot;theme_color&quot;:&quot;#0f172a&quot;,&quot;icons&quot;:[{&quot;src&quot;:&quot;data:image/svg+xml,&lt;svg xmlns=\&quot;http://www.w3.org/2000/svg\&quot; viewBox=\&quot;0 0 192 192\&quot;&gt;&lt;rect fill=\&quot;%2306b6d4\&quot; width=\&quot;192\&quot; height=\&quot;192\&quot;/&gt;&lt;text x=\&quot;50%\&quot; y=\&quot;50%\&quot; font-size=\&quot;100\&quot; font-weight=\&quot;bold\&quot; fill=\&quot;white\&quot; text-anchor=\&quot;middle\&quot; dominant-baseline=\&quot;central\&quot;&gt;V&lt;/text&gt;&lt;/svg&gt;&quot;,&quot;sizes&quot;:&quot;192x192&quot;,&quot;type&quot;:&quot;image/svg+xml&quot;}]}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Lexend:wght@400;500;600&display=swap');

        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1a2942;
            --bg-tertiary: #233556;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-tertiary: #94a3b8;
            --accent: #06b6d4;
            --accent-dark: #0891b2;
            --accent-bright: #00d9ff;
            --success: #10b981;
            --error: #ef4444;
            --error-dark: #dc2626;
            --warn: #f59e0b;
            --shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Lexend', sans-serif;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--bg-tertiary);
        }

        .title {
            font-size: 1.75rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent), var(--accent-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .mode-selector {
            display: flex;
            gap: 0.5rem;
            background: var(--bg-secondary);
            padding: 0.5rem;
            border-radius: 0.75rem;
            border: 1px solid var(--bg-tertiary);
        }

        .mode-btn {
            padding: 0.5rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-tertiary);
            cursor: pointer;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            font-family: 'Lexend', sans-serif;
        }

        .mode-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.3);
        }

        .mode-btn:hover:not(.active) {
            color: var(--text-secondary);
        }

        /* Stats Display */
        .stats-display {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-tertiary);
            border-radius: 1rem;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent);
        }

        .stat-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1;
        }

        .stat-unit {
            font-size: 0.875rem;
            color: var(--text-tertiary);
            margin-left: 0.25rem;
        }

        /* Text Area */
        .text-area-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            min-height: 0;
        }

        .reference-text {
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 1rem;
            padding: 2rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.25rem;
            line-height: 1.8;
            color: var(--text-tertiary);
            overflow-y: auto;
            transition: border-color 0.3s ease;
            user-select: none;
            flex: 1;
            min-height: 0;
        }

        .reference-text::-webkit-scrollbar {
            width: 6px;
        }

        .reference-text::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
            border-radius: 3px;
        }

        .reference-text::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        .reference-text.active {
            border-color: var(--accent);
            box-shadow: inset 0 0 12px rgba(6, 182, 212, 0.1);
        }

        .char {
            position: relative;
            transition: all 0.05s ease;
        }

        .char.correct {
            color: var(--success);
        }

        .char.incorrect {
            color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }

        .char.current {
            background: var(--accent);
            color: var(--bg-primary);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }

        .char.pending {
            color: var(--text-tertiary);
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .input-field {
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 1rem;
            padding: 1.5rem;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.125rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
            background: var(--bg-secondary);
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: 2px solid var(--bg-tertiary);
            border-radius: 0.75rem;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            font-family: 'Lexend', sans-serif;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg-primary);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: var(--accent-dark);
            border-color: var(--accent-dark);
            color: var(--text-primary);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Difficulty Selector */
        .difficulty-selector {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .difficulty-selector label {
            font-size: 0.875rem;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .difficulty-selector select {
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-family: 'Lexend', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .difficulty-selector select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .difficulty-selector select:hover {
            border-color: var(--accent);
        }

        /* Results Screen */
        .results-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .results-modal.show {
            display: flex;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .results-content {
            background: var(--bg-secondary);
            border: 2px solid var(--bg-tertiary);
            border-radius: 1.5rem;
            padding: 3rem;
            text-align: center;
            max-width: 500px;
            animation: contentSlideIn 0.4s ease-out;
        }

        @keyframes contentSlideIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .results-content h2 {
            font-size: 2rem;
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--accent), var(--accent-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .result-item {
            background: var(--bg-tertiary);
            padding: 1.5rem;
            border-radius: 1rem;
            border: 1px solid var(--bg-tertiary);
        }

        .result-item h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-tertiary);
            margin-bottom: 0.75rem;
        }

        .result-item .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .results-modal .btn {
            margin-top: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                gap: 1rem;
            }

            .title {
                font-size: 1.5rem;
            }

            .reference-text {
                padding: 1.5rem;
                font-size: 1.1rem;
            }

            .stats-display {
                grid-template-columns: repeat(2, 1fr);
            }

            .results-content {
                padding: 2rem;
                max-width: 90%;
            }

            .controls {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        /* Time display */
        .timer {
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            margin: 1rem 0;
        }

        .timer.warning {
            color: var(--warn);
            animation: pulse 0.6s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .completion-message {
            text-align: center;
            padding: 1rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 0.75rem;
            color: var(--success);
            font-weight: 500;
            display: none;
        }

        .completion-message.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Velocity</h1>
            <div class="mode-selector">
                <button class="mode-btn active" data-mode="practice">Practice</button>
                <button class="mode-btn" data-mode="stats">Stats</button>
            </div>
        </div>

        <div id="practiceMode">
            <div class="stats-display">
                <div class="stat-card">
                    <div class="stat-label">WPM</div>
                    <div class="stat-value"><span id="wpm">0</span><span class="stat-unit">wpm</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Accuracy</div>
                    <div class="stat-value"><span id="accuracy">100</span><span class="stat-unit">%</span></div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Errors</div>
                    <div class="stat-value" id="errors">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Time</div>
                    <div class="stat-value"><span id="timeElapsed">0</span><span class="stat-unit">s</span></div>
                </div>
            </div>

            <div class="text-area-wrapper">
                <div class="reference-text" id="referenceText"></div>
                <div class="input-area">
                    <div class="completion-message" id="completionMessage">✓ Text completed! Great job!</div>
                    <input 
                        type="text" 
                        class="input-field" 
                        id="userInput" 
                        placeholder="Click here to start typing..."
                        autocomplete="off"
                    >
                </div>
            </div>

            <div class="controls">
                <div class="difficulty-selector">
                    <label for="difficulty">Difficulty:</label>
                    <select id="difficulty">
                        <option value="easy">Easy (Common words)</option>
                        <option value="medium" selected>Medium (Mixed text)</option>
                        <option value="hard">Hard (Code & symbols)</option>
                    </select>
                </div>
                <button class="btn primary" id="startBtn">Start New Test</button>
                <button class="btn" id="resetBtn">Reset</button>
            </div>
        </div>

        <div id="statsMode" style="display: none; flex: 1;">
            <div style="text-align: center; padding: 2rem;">
                <h2 style="font-size: 1.5rem; margin-bottom: 1rem;">Your Statistics</h2>
                <div id="statsContent" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                    <div class="stat-card">
                        <div class="stat-label">Best WPM</div>
                        <div class="stat-value" id="bestWpm">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Average WPM</div>
                        <div class="stat-value" id="avgWpm">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Best Accuracy</div>
                        <div class="stat-value"><span id="bestAccuracy">0</span>%</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Tests Completed</div>
                        <div class="stat-value" id="testsCompleted">0</div>
                    </div>
                </div>
                <button class="btn" id="clearStatsBtn" style="margin-top: 2rem;">Clear Statistics</button>
            </div>
        </div>
    </div>

    <div class="results-modal" id="resultsModal">
        <div class="results-content">
            <h2>Test Complete!</h2>
            <div class="results-grid">
                <div class="result-item">
                    <h3>WPM</h3>
                    <div class="value" id="resultWpm">0</div>
                </div>
                <div class="result-item">
                    <h3>Accuracy</h3>
                    <div class="value"><span id="resultAccuracy">0</span>%</div>
                </div>
                <div class="result-item">
                    <h3>Errors</h3>
                    <div class="value" id="resultErrors">0</div>
                </div>
                <div class="result-item">
                    <h3>Time</h3>
                    <div class="value"><span id="resultTime">0</span>s</div>
                </div>
            </div>
            <button class="btn primary" id="tryAgainBtn">Try Again</button>
        </div>
    </div>

    <script>
        // Text data for different difficulties
        const textSamples = {
            easy: [
                "The quick brown fox jumps over the lazy dog. This pangram contains every letter of the alphabet.",
                "Practice makes perfect. The more you type the faster you will become. Keep pushing yourself.",
                "Typing is an essential skill in the modern world. It helps you work faster and more efficiently.",
                "Learning to type properly takes time and dedication. Focus on accuracy first, speed follows naturally.",
                "Every keystroke brings you closer to mastery. Stay consistent and track your progress every day.",
            ],
            medium: [
                "In the realm of software development, clean code is paramount. It improves readability, maintainability, and ultimately performance. Variables should be named descriptively to convey their purpose without ambiguity.",
                "The digital age has transformed how we communicate and collaborate. Cloud computing enables unprecedented scalability and flexibility for businesses of all sizes worldwide.",
                "Artificial intelligence continues to reshape industries from healthcare to finance. Machine learning models require substantial computational resources and carefully curated training data.",
                "Web development combines art and science, blending creative design with technical implementation. Responsive design ensures applications function seamlessly across all devices.",
                "Cybersecurity remains a critical concern in our interconnected world. Strong encryption, multi-factor authentication, and regular security audits protect sensitive information from unauthorized access.",
            ],
            hard: [
                "const fibonacci = (n) => n <= 1 ? n : fibonacci(n-1) + fibonacci(n-2); const result = fibonacci(10); console.log(`Result: ${result}`);",
                "function* generator() { yield 1; yield 2; yield* [3, 4]; } const gen = generator(); console.log([...gen]); // [1, 2, 3, 4]",
                "const obj = { name: 'Alice', age: 30, address: { city: 'NYC', zip: '10001' } }; const { address: { city } } = obj;",
                "async function fetchData(url) { try { const response = await fetch(url); return await response.json(); } catch(e) { console.error(e); } }",
                "Promise.all([promise1, promise2]).then(([res1, res2]) => { /* handle results */ }).catch(err => console.error(err));",
            ]
        };

        // State
        let state = {
            currentText: '',
            userInput: '',
            isTyping: false,
            startTime: null,
            difficulty: 'medium',
            stats: [],
        };

        // Wait for DOM to be ready
        function whenReady(callback) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', callback);
            } else {
                callback();
            }
        }

        whenReady(function() {
            // DOM Elements
            const referenceText = document.getElementById('referenceText');
            const userInput = document.getElementById('userInput');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');
            const difficultySelect = document.getElementById('difficulty');
            const wpmDisplay = document.getElementById('wpm');
            const accuracyDisplay = document.getElementById('accuracy');
            const errorsDisplay = document.getElementById('errors');
            const timeDisplay = document.getElementById('timeElapsed');
            const resultsModal = document.getElementById('resultsModal');
            const tryAgainBtn = document.getElementById('tryAgainBtn');
            const modeBtns = document.querySelectorAll('.mode-btn');
            const practiceMode = document.getElementById('practiceMode');
            const statsMode = document.getElementById('statsMode');
            const clearStatsBtn = document.getElementById('clearStatsBtn');
            const completionMessage = document.getElementById('completionMessage');

            console.log('DOM Ready - buttons found:', {startBtn, resetBtn, tryAgainBtn});

            // Load stats from localStorage
            function loadStats() {
                try {
                    const saved = localStorage.getItem('typingTutorStats');
                    return saved ? JSON.parse(saved) : [];
                } catch (e) {
                    return [];
                }
            }

            function saveStats() {
                try {
                    localStorage.setItem('typingTutorStats', JSON.stringify(state.stats));
                } catch (e) {
                    console.error('Could not save stats:', e);
                }
            }

            function updateStatsDisplay() {
                if (state.stats.length === 0) {
                    document.getElementById('bestWpm').textContent = '0';
                    document.getElementById('avgWpm').textContent = '0';
                    document.getElementById('bestAccuracy').textContent = '0';
                    document.getElementById('testsCompleted').textContent = '0';
                    return;
                }

                const bestWpm = Math.max(...state.stats.map(s => s.wpm));
                const avgWpm = Math.round(state.stats.reduce((sum, s) => sum + s.wpm, 0) / state.stats.length);
                const bestAccuracy = Math.max(...state.stats.map(s => s.accuracy));
                const testsCompleted = state.stats.length;

                document.getElementById('bestWpm').textContent = bestWpm;
                document.getElementById('avgWpm').textContent = avgWpm;
                document.getElementById('bestAccuracy').textContent = Math.round(bestAccuracy);
                document.getElementById('testsCompleted').textContent = testsCompleted;
            }

            // Mode switching
            modeBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    modeBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    if (btn.dataset.mode === 'practice') {
                        practiceMode.style.display = 'flex';
                        statsMode.style.display = 'none';
                    } else {
                        practiceMode.style.display = 'none';
                        statsMode.style.display = 'flex';
                        updateStatsDisplay();
                    }
                });
            });

            function loadNewText() {
                state.difficulty = difficultySelect.value;
                const samples = textSamples[state.difficulty];
                state.currentText = samples[Math.floor(Math.random() * samples.length)];
                renderReferenceText();
                state.userInput = '';
                userInput.value = '';
                state.isTyping = false;
                state.startTime = null;
                completionMessage.classList.remove('show');
                resetStats();
                userInput.focus();
            }

            function renderReferenceText() {
                referenceText.innerHTML = '';
                state.currentText.split('').forEach((char, index) => {
                    const span = document.createElement('span');
                    span.className = 'char pending';
                    span.textContent = char;

                    if (index < state.userInput.length) {
                        if (state.userInput[index] === char) {
                            span.className = 'char correct';
                        } else {
                            span.className = 'char incorrect';
                        }
                    } else if (index === state.userInput.length) {
                        span.className = 'char current';
                    }

                    referenceText.appendChild(span);
                });

                // Auto-scroll to current character
                const currentChar = referenceText.querySelector('.char.current');
                if (currentChar) {
                    currentChar.scrollIntoView({ block: 'center', behavior: 'smooth' });
                }
            }

            function resetStats() {
                wpmDisplay.textContent = '0';
                accuracyDisplay.textContent = '100';
                errorsDisplay.textContent = '0';
                timeDisplay.textContent = '0';
            }

            function calculateStats() {
                const timeElapsed = (Date.now() - state.startTime) / 1000;
                const timeInMinutes = timeElapsed / 60;
                const wordsTyped = state.userInput.trim().split(/\s+/).length;
                const wpm = Math.round(wordsTyped / timeInMinutes) || 0;

                let correctChars = 0;
                for (let i = 0; i < state.userInput.length; i++) {
                    if (state.userInput[i] === state.currentText[i]) {
                        correctChars++;
                    }
                }

                const totalChars = state.userInput.length;
                const accuracy = totalChars > 0 ? Math.round((correctChars / totalChars) * 100) : 100;
                const errors = totalChars - correctChars;

                return {
                    wpm,
                    accuracy,
                    errors,
                    timeElapsed: Math.round(timeElapsed),
                };
            }

            function updateLiveStats() {
                const stats = calculateStats();
                wpmDisplay.textContent = stats.wpm;
                accuracyDisplay.textContent = stats.accuracy;
                errorsDisplay.textContent = stats.errors;
                timeDisplay.textContent = stats.timeElapsed;
            }

            // Event Listeners
            userInput.addEventListener('input', (e) => {
                state.userInput = e.target.value;

                if (!state.isTyping && state.userInput.length > 0) {
                    state.isTyping = true;
                    state.startTime = Date.now();
                    referenceText.classList.add('active');
                }

                renderReferenceText();
                updateLiveStats();

                if (state.userInput === state.currentText) {
                    completeTest();
                }
            });

            function completeTest() {
                state.isTyping = false;
                const stats = calculateStats();
                state.stats.push(stats);
                saveStats();
                completionMessage.classList.add('show');

                setTimeout(() => {
                    showResults(stats);
                }, 500);
            }

            function showResults(stats) {
                document.getElementById('resultWpm').textContent = stats.wpm;
                document.getElementById('resultAccuracy').textContent = stats.accuracy;
                document.getElementById('resultErrors').textContent = stats.errors;
                document.getElementById('resultTime').textContent = stats.timeElapsed;
                resultsModal.classList.add('show');
            }

            // Button Click Handlers
            startBtn.addEventListener('click', function(e) {
                console.log('Start button clicked');
                e.preventDefault();
                loadNewText();
            });

            resetBtn.addEventListener('click', function(e) {
                console.log('Reset button clicked');
                e.preventDefault();
                state.userInput = '';
                userInput.value = '';
                state.isTyping = false;
                state.startTime = null;
                renderReferenceText();
                resetStats();
                referenceText.classList.remove('active');
                completionMessage.classList.remove('show');
                userInput.focus();
            });

            tryAgainBtn.addEventListener('click', function(e) {
                console.log('Try Again button clicked');
                e.preventDefault();
                resultsModal.classList.remove('show');
                loadNewText();
            });

            clearStatsBtn.addEventListener('click', function(e) {
                console.log('Clear Stats button clicked');
                e.preventDefault();
                if (confirm('Are you sure you want to clear all statistics?')) {
                    state.stats = [];
                    saveStats();
                    updateStatsDisplay();
                }
            });

            difficultySelect.addEventListener('change', function(e) {
                console.log('Difficulty changed to:', this.value);
                loadNewText();
            });

            // Initialize
            state.stats = loadStats();
            updateStatsDisplay();
            loadNewText();

            console.log('Typing Tutor initialized successfully');
        });
    </script>
</body>
</html>
