<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity - Certificates</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Poppins:wght@400;600;700&display=swap');

        :root {
            --bg: #0f172a;
            --bg-light: #1a2942;
            --bg-lighter: #233556;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f59e0b, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .certificates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .certificate-card {
            background: var(--bg-light);
            border: 2px solid var(--bg-lighter);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .certificate-card:hover {
            border-color: var(--accent);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(6, 182, 212, 0.2);
        }

        .cert-preview {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #1a2942, #0f172a);
            border-bottom: 3px solid var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            font-size: 3rem;
        }

        .cert-content {
            padding: 20px;
        }

        .cert-type {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-dim);
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .cert-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--accent);
        }

        .cert-info {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .cert-date {
            font-size: 0.8rem;
            color: var(--text-dim);
            margin-bottom: 15px;
        }

        .cert-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            background: var(--bg-lighter);
            border: 2px solid var(--bg-lighter);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn.primary {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        .btn.primary:hover {
            background: #0891b2;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-light);
            border: 2px dashed var(--bg-lighter);
            border-radius: 12px;
        }

        .empty-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .empty-text {
            color: var(--text-dim);
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .empty-hint {
            color: var(--text-dim);
            font-size: 0.9rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--bg-light);
            border: 2px solid var(--bg-lighter);
            border-radius: 12px;
            padding: 30px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal h2 {
            margin-bottom: 20px;
            color: var(--accent);
        }

        .certificate-preview-box {
            width: 100%;
            aspect-ratio: 8.5 / 11;
            background: linear-gradient(135deg, #1a2942, #0f172a);
            border: 3px solid var(--accent);
            border-radius: 12px;
            padding: 40px;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .cert-header-preview {
            font-size: 2rem;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .cert-body-preview {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            font-size: 1.1rem;
            line-height: 1.8;
        }

        .cert-footer-preview {
            font-size: 0.8rem;
            color: var(--text-dim);
            border-top: 2px solid var(--accent);
            padding-top: 15px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 1.8rem;
            }

            .certificates-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
            }

            .certificate-preview-box {
                aspect-ratio: auto;
                min-height: 400px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 class="title">🎓 Your Certificates</h1>
            <p class="subtitle">Track and manage your earned certificates</p>
        </div>

        <!-- Certificates Grid -->
        <div id="certificatesContainer">
            <div class="empty-state">
                <div class="empty-icon">📜</div>
                <div class="empty-text">No certificates yet</div>
                <div class="empty-hint">Complete lessons, levels, or the full course to earn certificates</div>
            </div>
        </div>
    </div>

    <!-- Certificate Preview Modal -->
    <div id="certificateModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Certificate Preview</h2>
            <div id="certificatePreview" class="certificate-preview-box">
                <div class="cert-header-preview" id="previewHeader">Certificate</div>
                <div class="cert-body-preview" id="previewBody">Loading...</div>
                <div class="cert-footer-preview" id="previewFooter">Certificate ID: -</div>
            </div>
            <div class="modal-actions">
                <button class="btn primary" onclick="downloadCurrentCertificate()" style="flex: 1;">📥 Download</button>
                <button class="btn primary" onclick="printCurrentCertificate()" style="flex: 1;">🖨️ Print</button>
                <button class="btn" onclick="closeModal()" style="flex: 1;">Close</button>
            </div>
        </div>
    </div>

    <script src="certificate-system.js"></script>
    <script>
        let currentCertificateId = null;

        // Mock data for demonstration
        const mockCertificates = [
            {
                id: "CERT1",
                type: "lesson",
                studentName: "You",
                templateUsed: "Lesson Completion Certificate",
                data: {
                    studentName: "You",
                    lessonTitle: "Lesson 5: Home Row Mastery",
                    wpm: 52,
                    accuracy: 97,
                    date: new Date().toLocaleDateString()
                },
                createdDate: new Date().toISOString(),
                signatureKey: "SIG-LESSON-001"
            },
            {
                id: "CERT2",
                type: "level",
                studentName: "You",
                templateUsed: "Level Completion Certificate",
                data: {
                    studentName: "You",
                    levelNumber: 1,
                    levelName: "Foundation",
                    wpm: 48,
                    accuracy: 94,
                    badges: 4,
                    date: new Date().toLocaleDateString()
                },
                createdDate: new Date(Date.now() - 86400000).toISOString(),
                signatureKey: "SIG-LEVEL-001"
            },
            {
                id: "CERT3",
                type: "course",
                studentName: "You",
                templateUsed: "Professional Typist Certificate",
                data: {
                    studentName: "You",
                    wpm: 68,
                    accuracy: 96,
                    points: 5400,
                    badges: 13,
                    date: new Date(Date.now() - 172800000).toISOString()
                },
                createdDate: new Date(Date.now() - 172800000).toISOString(),
                signatureKey: "SIG-COURSE-001"
            }
        ];

        function renderCertificates() {
            const container = document.getElementById("certificatesContainer");
            
            if (mockCertificates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📜</div>
                        <div class="empty-text">No certificates yet</div>
                        <div class="empty-hint">Complete lessons, levels, or the full course to earn certificates</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = mockCertificates.map(cert => `
                <div class="certificate-card">
                    <div class="cert-preview">${getCertificateEmoji(cert.type)}</div>
                    <div class="cert-content">
                        <div class="cert-type">${cert.type} Certificate</div>
                        <div class="cert-title">${getCertificateTitle(cert)}</div>
                        <div class="cert-info">${getCertificateInfo(cert)}</div>
                        <div class="cert-date">Issued: ${new Date(cert.createdDate).toLocaleDateString()}</div>
                        <div class="cert-actions">
                            <button class="btn" onclick="viewCertificateModal('${cert.id}')">👁️ View</button>
                            <button class="btn" onclick="downloadCert('${cert.id}')">📥 Download</button>
                            <button class="btn" onclick="printCert('${cert.id}')">🖨️ Print</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getCertificateEmoji(type) {
            const emojis = { lesson: "📋", level: "🏆", course: "💎" };
            return emojis[type] || "📜";
        }

        function getCertificateTitle(cert) {
            if (cert.type === "lesson") return cert.data.lessonTitle || "Lesson Certificate";
            if (cert.type === "level") return `Level ${cert.data.levelNumber}: ${cert.data.levelName}`;
            if (cert.type === "course") return "Professional Typist";
            return "Certificate";
        }

        function getCertificateInfo(cert) {
            if (cert.type === "lesson") return `${cert.data.wpm} WPM • ${cert.data.accuracy}% Accuracy`;
            if (cert.type === "level") return `${cert.data.wpm} WPM • ${cert.data.accuracy}% Accuracy • ${cert.data.badges} Badges`;
            if (cert.type === "course") return `${cert.data.wpm} WPM • ${cert.data.accuracy}% Accuracy • ${cert.data.points} Points`;
            return "";
        }

        function viewCertificateModal(certId) {
            const cert = mockCertificates.find(c => c.id === certId);
            if (!cert) return;

            currentCertificateId = certId;

            document.getElementById("modalTitle").textContent = getCertificateTitle(cert);
            document.getElementById("previewHeader").textContent = getCertificateEmoji(cert.type) + " " + getCertificateTitle(cert);
            document.getElementById("previewBody").innerHTML = `
                <div>
                    <strong>${cert.data.studentName}</strong><br><br>
                    ${getCertificateInfo(cert)}<br>
                    ${cert.type === "course" ? `Completed Full Course` : `Lesson: ${cert.data.lessonTitle || cert.data.levelName}`}
                </div>
            `;
            document.getElementById("previewFooter").textContent = `Certificate ID: ${cert.id} | Issued: ${new Date(cert.createdDate).toLocaleDateString()}`;

            document.getElementById("certificateModal").classList.add("show");
        }

        function downloadCert(certId) {
            currentCertificateId = certId;
            downloadCurrentCertificate();
        }

        function printCert(certId) {
            currentCertificateId = certId;
            printCurrentCertificate();
        }

        function downloadCurrentCertificate() {
            if (!currentCertificateId) return;
            const cert = mockCertificates.find(c => c.id === currentCertificateId);
            if (cert) {
                alert(`Downloaded: ${getCertificateTitle(cert)}.html`);
            }
        }

        function printCurrentCertificate() {
            if (!currentCertificateId) return;
            alert("Opening print dialog...");
            window.print();
        }

        function closeModal() {
            document.getElementById("certificateModal").classList.remove("show");
        }

        // Initialize
        window.addEventListener("DOMContentLoaded", () => {
            renderCertificates();
        });
    </script>
</body>
</html>
